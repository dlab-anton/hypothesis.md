name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hypothesis_engine_api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install poetry==2.4.3 poetry-plugin-export==1.10.0 pip-audit==2.10.1
      - run: poetry check --lock
      - run: poetry install --no-root --no-interaction
      - name: Verify runtime dependency export
        run: |
          poetry export --format requirements.txt --without-hashes --output requirements.generated.txt
          diff -u requirements.txt requirements.generated.txt
      - name: Check Python syntax and undefined names
        run: poetry run ruff check app scripts tests --select E9,F63,F7,F82
      - name: Migrate and test a fresh UUID database
        run: poetry run python scripts/test_database.py
      - name: Audit pinned Python runtime and development dependencies
        run: |
          poetry export --with dev --format requirements.txt --without-hashes --output requirements.audit.txt
          pip-audit -r requirements.audit.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hypothesis_engine_ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hypothesis_engine_ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run typegen:check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      - run: npm audit --audit-level=moderate
